<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Elf | Fierox Foundry</title>
    <meta name="description" content="Portfolio of Fierox Foundry. Specialised in custom Ball Jointed Dolls (BJD), 3D printing and CG.">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --bg-color: #101010;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-color: #d4af37;
            --border-color: #2a2a2a;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navigatiebalk */
        nav {
            padding: 1.5rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            position: relative;
        }

        nav h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .back-btn {
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            /* Button styling die lijkt op de onderste knop */
            color: var(--text-color);
            background-color: var(--bg-color); /* Maakt hem net iets donkerder dan de balk zelf */
            padding: 10px 20px;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Zorgt dat de nieuwe knop op mobiel netjes in het midden staat */
        @media (max-width: 600px) {
            .back-btn {
                position: static;
                display: inline-block;
                transform: none;
                margin-bottom: 1rem;
            }
        }

        .back-btn:hover {
            color: #fff;
        }

        @media (max-width: 600px) {
            .back-btn {
                position: static;
                display: block;
                transform: none;
                margin-bottom: 1rem;
            }
        }

        /* Content sectie */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .project-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .project-header h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .project-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Foto's onder elkaar - Nu met vaste verhouding en klik-effect */
        .photo-stack {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            max-width: 400px; /* Voorkomt dat de foto's op de pagina gigantisch worden */
            margin: 0 auto;   /* Centreert de hele fotokolom netjes in het midden */
        }

        .photo-stack img {
            width: 100%;
            aspect-ratio: 4 / 5; /* Aangepast naar 4/5 (verticale Instagram standaard) */
            object-fit: cover; 
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #222;
            cursor: zoom-in; 
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        /* Zweef-effect om te laten zien dat ze klikbaar zijn */
        .photo-stack img:hover {
            transform: scale(1.02);
            border-color: var(--accent-color);
        }

        .photo-caption {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.75rem;
            font-style: italic;
        }

        /* DE LIGHTBOX (Het beeldvullende donkere scherm) */
        #lightbox {
            display: none; /* Standaard onzichtbaar */
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 1);
            align-items: center;
            justify-content: center;
            cursor: zoom-out; /* Muis wordt een 'uitzoom' icoon */
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain; /* Zorgt dat de originele foto er altijd in z'n geheel oppast */
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: var(--card-bg);
        }

        /* Knop onderaan de pagina */
        .bottom-nav {
            text-align: center;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .bottom-back-btn {
            display: inline-block;
            color: var(--text-color);
            background-color: var(--card-bg);
            padding: 12px 24px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .bottom-back-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>

    <!-- Het verborgen Lightbox element -->
    <div id="lightbox">
        <img id="lightbox-img" src="" alt="Grote weergave">
    </div>

    <!-- Het Javascript dat het klik-effect regelt -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const photos = document.querySelectorAll('.photo-stack img');

        // Geef elke foto een klik-actie
        photos.forEach(photo => {
            photo.addEventListener('click', () => {
                lightboxImg.src = photo.src; // Kopieer de foto naar de lightbox
                lightbox.style.display = 'flex'; // Maak de lightbox zichtbaar
            });
        });

        // Sluit de lightbox als je erop klikt
        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });
    </script>
